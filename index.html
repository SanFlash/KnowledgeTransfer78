<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>KT78 - Project Understanding</title>
  <link rel="stylesheet" href="style.css">
  <style>

  background-color: #111;

  font-size: 14px;
  width: 100%;
}
  </style>
</head>
<body>

  <header>
    <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
    <h1>KT78 - Project Understanding Hub</h1>
  </header>

  <div class="container">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <h3>Projects</h3>
      <ul>
        <li onclick="loadPage('pages/KeySpace.html')">📄 KeySpace</li>
        <li onclick="loadPage('pages/playwrightLocators.html')">📄 Playwright Locators</li>

        <li onclick="loadPage('pages/goodly_documentation.html')">📄 Goodly</li>
        <li onclick ="loadPage('pages/mobile_automation_curriculum.html')">📄 Mobile Automation 1</li>

    <!-- Content -->
    <main class="content">

  </div>

  <!-- Footer -->
  <footer class="footer">
    <p>Developed by Satyendra Kumar Namdeo</p>
  </footer>

  <script>
    function toggleSidebar() {
      document.getElementById("sidebar").classList.toggle("active");
    }

    function loadPage(page) {
      document.getElementById("viewer").src = page;

      // auto close sidebar on mobile after click
      if (window.innerWidth < 768) {
        document.getElementById("sidebar").classList.remove("active");
      }
    }
  </script>

</body>
</html>
